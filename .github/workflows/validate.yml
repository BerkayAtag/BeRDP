name: Validate BeRDP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Regression and configuration tests
        shell: pwsh
        run: |
          dotnet run --project tests/BeRdp.Regression -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project src/BeRdp.ServiceSetup -c Release -- --self-test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build src/BeRdp.AdminConsole -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build installer artifacts
        shell: pwsh
        run: ./installer/Build-Installers.ps1
      - name: Verify Windows installation and appwiz Publisher
        shell: pwsh
        run: ./tests/Smoke.Installers.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: BeRDP-unsigned-win-x64
          path: dist/installers/*
          if-no-files-found: error
          retention-days: 14
